# Site settings
title: "Mitch Smith"
description: "Software engineer and indie app developer from Baltimore. Mobile apps for iOS and Android — games, travel tools, and music."
url: "https://mitchell525.github.io"
baseurl: ""
logo: "/img/icons/material/ic_material_product_icon_192px copy 2mdpi.png"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Pages configuration
defaults:
  - scope:
      path: "pages"
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "legal"
      type: "pages"
    values:
      layout: "legal"
      permalink: /:path/:basename.html
      robots: "noindex, follow"
      sitemap: false
  - scope:
      path: "support"
      type: "pages"
    values:
      layout: "support"
      permalink: /:path/:basename.html
      robots: "noindex, follow"
      sitemap: false
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "apps"
    values:
      seo:
        type: "WebPage"

# Development settings
livereload: true
incremental: true

# Collections
collections:
  apps:
    output: true
    permalink: /:name/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - TODO.md
  - style.md
  - FIXES.md
  - CLAUDE.md
  - vendor/

# SEO settings
twitter:
  username: mitchell525
  card: summary_large_image

# Google Analytics
# OLD - google_analytics: UA-112034969-4
google_analytics: G-JQBKZ4XTC1