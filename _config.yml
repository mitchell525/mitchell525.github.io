# Site settings
title: "Mitch Smith"
description: "Software engineer and indie app developer from Baltimore. iOS apps — games, travel tools, and music."
url: "https://mitchell525.github.io"
baseurl: ""
logo: "/img/icons/material/icon-192.png"
# jekyll-seo-tag puts this on every BlogPosting as its author and gives the
# publisher block a name; without it both were missing from the JSON-LD.
author:
  name: "Mitchell Smith"
  url: "https://mitchell525.github.io/about/"
# App Store Connect provider token, appended as ?pt=…&ct=…&mt=8 on store links
# so App Analytics can attribute installs to the site (ct=site) and blog (ct=blog).
app_store_pt: "120429264"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Pages configuration
defaults:
  - scope:
      path: ""
    values:
      image: "/img/social/og-default.png"
  - scope:
      path: "pages"
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "legal"
      type: "pages"
    values:
      layout: "legal"
      permalink: /:path/:basename.html
      robots: "noindex, follow"
      sitemap: false
  - scope:
      path: "support"
      type: "pages"
    values:
      layout: "support"
      permalink: /:path/:basename.html
      robots: "noindex, follow"
      sitemap: false
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "apps"
    values:
      seo:
        type: "WebPage"

# Development settings
livereload: true

# Collections
collections:
  apps:
    output: true
    permalink: /:name/

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - TODO.md
  - style.md
  - FIXES.md
  - CLAUDE.md
  - vendor/

# SEO settings
# Second ownership proof for Search Console, so verification does not rest
# solely on the GA4 tag (removing G-JQBKZ4XTC1 would otherwise un-verify the
# property). jekyll-seo-tag renders this key as the google-site-verification
# meta tag - do not hand-add one to _layouts/default.html, that duplicates it.
# If ever clearing this, comment the line out rather than setting it to "":
# an empty string is truthy in Liquid and would render content="".
google_site_verification: "lycZkEUOXyqxe_f-oNMinGmxPNpINXCwI-GuNFjMMHE"

twitter:
  username: mtsmithdesign
  card: summary_large_image

# Google Analytics
# OLD - google_analytics: UA-112034969-4
google_analytics: G-JQBKZ4XTC1