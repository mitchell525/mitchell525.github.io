<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="robots" content="noindex, nofollow">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Knight Ball</title>
	<style>
		html, body { margin: 0; height: 100%; background: #0d0a1a; }
		body { display: flex; align-items: center; justify-content: center; }
		iframe { display: block; border: 0; width: min(1280px, 92vw, calc(88vh * 16 / 9)); aspect-ratio: 16 / 9;

		@media (max-width: 760px), (max-height: 500px) {
			iframe { width: 100vw; height: 100vh; aspect-ratio: auto; border-radius: 0; box-shadow: none; }
		}
	</style>
