<!doctype html>
<html lang="en">
<head>
    <!-- Icon -->
    <link rel="icon" href="/img/icons/material/icon-192.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Required meta tags -->
    <meta charset="utf-8" /> 
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    {% if page.robots %}
    <meta name="robots" content="{{ page.robots }}">
    {% endif %}

    <!-- Security headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; font-src 'self' https://cdn.jsdelivr.net data:;">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- Modern meta tags -->
    <meta name="theme-color" content="#f8f8f8">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/icons/material/apple-touch-icon-180.png">

    <!-- Performance optimizations -->
    <link rel="preconnect" href="https://www.googletagmanager.com">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">

    <!-- SEO and meta descriptors -->
    {% include seo-vars.html %}
    {% seo %}
    {% feed_meta %}

    <!-- Bootstrap CSS 5.3+ -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
        integrity="sha384-Bk5cbLkZQ5raZ0+H2/+VbfYx3WpvxvQK4zqXZr7sYODuaX7bKXoSOnipQxkaS8sv"
        crossorigin="anonymous">
    
    <link rel="stylesheet" href="/css/mitchell525.css">

    <!-- Global site tag (gtag.js) - Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        
        // Check for existing consent cookie
        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }
        
        // Check if user has already given consent
        const hasConsent = getCookie('cookie_consent') !== null;
        const analyticsAllowed = getCookie('cookie_analytics') === 'true';
        
        // Consent Mode v2: cookieless pings when denied; full tracking only after opt-in
        gtag('consent', 'default', {
            'analytics_storage': (hasConsent && analyticsAllowed) ? 'granted' : 'denied',
            'ad_storage': 'denied',
            'ad_user_data': 'denied',
            'ad_personalization': 'denied',
            'functionality_storage': (hasConsent && analyticsAllowed) ? 'granted' : 'denied',
            'security_storage': 'granted'
        });
        
        gtag('js', new Date());
        gtag('config', '{{ site.google_analytics }}', {
            send_page_view: true,
            allow_google_signals: false
        });
    </script>
</head>

<!-- Main body -->
<body>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Header -->
    <header>
        {% include navbar.html %}
    </header>

    <!-- Main content -->
    <main id="main-content" tabindex="-1">
        {{ content }}
    </main>

    <!-- Footer -->
    {% include footer.html %}

    <!-- Cookie Banner -->
    {% include cookie-banner.html %}

    <!-- Bootstrap JS 5.3+ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous" defer></script>
    
    <!-- Custom JavaScript -->
    <script src="/js/mitchell525.js" defer></script>

    {% if page.url == '/' or page.url == '/about/' %}
    <!-- Structured data -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Mitchell Smith",
        "jobTitle": "Software Engineer",
        "description": "Full time Software Engineer and father from Baltimore Maryland. In his free time he enjoys creating apps as a hobby.",
        "url": "{{ site.url }}",
        "sameAs": [
            "https://twitter.com/mitchell525"
        ]
    }
    </script>
    {% endif %}

</body>
</html>
