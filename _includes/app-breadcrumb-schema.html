<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
        {
            "@type": "ListItem",
            "position": 1,
            "name": "Portfolio",
            "item": {{ site.url | append: "/" | jsonify }}
        },
        {
            "@type": "ListItem",
            "position": 2,
            "name": {{ app.name | jsonify }},
            "item": {{ page.url | absolute_url | jsonify }}
        }
    ]
}
</script>
