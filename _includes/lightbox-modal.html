<div id="screenshotModal" class="lightbox-modal" role="dialog" aria-modal="true" aria-labelledby="lightboxTitle" aria-hidden="true">
    <div class="lightbox-overlay" aria-hidden="true"></div>
    <div class="lightbox-container">
        <h2 id="lightboxTitle" class="visually-hidden">Enlarged screenshot</h2>
        <button type="button" class="lightbox-close" aria-label="Close enlarged screenshot">&times;</button>
        <img id="lightboxImage" class="lightbox-image">
    </div>
</div>
