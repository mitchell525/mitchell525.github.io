<footer class="ms-footer-modern">
    <div class="container">
        <!-- Main Footer Content -->
        <div class="footer-main">
            <!-- Brand Section -->
            <div class="footer-brand">
                <div class="footer-logo">
                    <img src="/img/icons/ms_home_icon.webp" alt="Mitchell Smith" class="brand-icon" width="512" height="512" loading="lazy" decoding="async" />
                </div>
                <div class="brand-info">
                    <h3 class="brand-name">Mitchell Smith</h3>
                    <p class="brand-tagline">Software Engineer</p>
                </div>
                <div class="footer-social">
                    <a href="https://bsky.app/profile/mitchell525.bsky.social" class="footer-social-link" rel="me noopener" target="_blank" aria-label="Mitchell Smith on Bluesky">
                        <i class="bi bi-bluesky" aria-hidden="true"></i>
                    </a>
                    <a href="https://github.com/mitchell525" class="footer-social-link" rel="me noopener" target="_blank" aria-label="Mitchell Smith on GitHub">
                        <i class="bi bi-github" aria-hidden="true"></i>
                    </a>
                    <a href="https://x.com/mtsmithdesign" class="footer-social-link" rel="me noopener" target="_blank" aria-label="Mitchell Smith on X">
                        <i class="bi bi-twitter-x" aria-hidden="true"></i>
                    </a>
                    <a href="/feed.xml" class="footer-social-link" aria-label="Subscribe to the blog RSS feed">
                        <i class="bi bi-rss" aria-hidden="true"></i>
                    </a>
                </div>
            </div>
            
            <!-- Apps Section -->
            <div class="footer-apps">
                <h4 class="footer-section-title">Apps</h4>
                <div class="apps-grid">
                    {% assign apps = site.data.apps | where_exp: "app", "app.hidden_from_home != true" | sort: 'name' %}
                    {% for app in apps %}
                    <a href="/{{ app.slug }}/" class="app-link">
                        <span class="app-name">{{ app.name }}</span>
                    </a>
                    {% endfor %}
                </div>
            </div>
        </div>
        
    </div>
    
    <!-- Footer Bottom -->
    <div class="footer-bottom">
        <div class="footer-bottom-content">
            <div class="copyright">
                <span>&copy; {{ site.time | date: "%Y" }} Mitchell Smith. All rights reserved.</span>
            </div>
            <div class="footer-links">
                <a href="/blog/" class="footer-link">Blog</a>
                <a href="/pages/legal/" class="footer-link">Legal</a>
                <a href="/about/" class="footer-link">About</a>
                <button type="button" id="open-cookie-settings" class="footer-link">Cookie preferences</button>
            </div>
        </div>
    </div>
</footer>
